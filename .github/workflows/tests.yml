name: Test PHPDOM
on:
  push:
    paths-ignore:
      - '**.md'

  pull_request:
    paths-ignore:
      - '**.md'

jobs:
  test:
    name: Test PHP ${{ matrix.php-versions }} on ubuntu
    runs-on: 'ubuntu-latest'

    strategy:
      fail-fast: false
      matrix:
        php-versions: ['8.4']
        composer-options: ['--optimize-autoloader']
        coverage: ['none']
        include:
          - php-versions: '8.4'
            composer-options: '--optimize-autoloader --ignore-platform-reqs'
            coverage: 'pcov'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP, with composer and extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          extensions: ctype, mbstring, opcache, pcre, gmp
          ini-values: zend.assertions=1
          coverage: ${{ matrix.coverage }}

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer update ${{ matrix.composer-options }}

      - name: Run Tests
        run: |
          if [[ ${{ matrix.php-versions == '8.4' }} ]]; then
            mkdir -p ./build/coverage/
            vendor/bin/phpunit --coverage-clover ./build/coverage/clover.xml
          else
            vendor/bin/phpunit --no-coverage
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: ${{ always() && matrix.php-versions == '8.4' }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./build/coverage/clover.xml
          name: PHP ${{ matrix.php-versions }}
